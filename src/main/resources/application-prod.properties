# /data is mounted as a named volume by Docker Compose.
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:/data/simplelms;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
spring.docker.compose.enabled=false

# The frontend is served by this app, so the public URL is the app's own address.
app.frontend-url=${FRONTEND_URL:http://localhost:8080}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:myuser}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:secret}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
