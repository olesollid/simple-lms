# Enable only with the dev profile.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Frontend dev server URL, used for OAuth2 login redirects and CORS.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Real OAuth secrets must be set as environment variables before running with
# this profile, e.g. GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET, GOOGLE_CLIENT_ID,
# GOOGLE_CLIENT_SECRET. See README.

# RabbitMQ and Redis connection details, matching compose.yaml. Only set here (not in the
# profile-independent application.properties) since the quiz-grading @RabbitListener consumer
# connects to the broker eagerly at startup -- keeping this dev-only means tests, CI, and running
# with no profile never depend on a broker being reachable. Start the services with
# `docker compose up rabbitmq redis` before running with this profile.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:myuser}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:secret}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
