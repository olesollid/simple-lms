# Enable only with the dev profile.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
spring.docker.compose.enabled=false

# Frontend dev server URL, used for OAuth2 login redirects and CORS.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Real OAuth secrets must be set as environment variables before running with
# this profile, e.g. GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET, GOOGLE_CLIENT_ID,
# GOOGLE_CLIENT_SECRET, FEIDE_CLIENT_ID, FEIDE_CLIENT_SECRET. See README.

# Only set here (not in the profile-independent application.properties) since it triggers a
# real network call to Dataporten at startup; keeping it dev-only means tests and CI never pay
# that cost. src/test/resources/application-dev.properties overrides this back out for any test
# that activates the dev profile, so it never reaches Dataporten either.
spring.security.oauth2.client.provider.feide.issuer-uri=https://auth.dataporten.no
spring.security.oauth2.client.registration.feide.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.feide.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
