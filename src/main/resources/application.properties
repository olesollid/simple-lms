spring.application.name=canvas2

# Disposable development database. Override these settings for deployments.
spring.datasource.url=jdbc:h2:mem:canvas2;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# Local dev uses in-memory H2, not the services in compose.yaml -- don't require Docker to run.
spring.docker.compose.enabled=false

# Dummy defaults so the app and CI can start without real OAuth secrets.
# Override GITHUB_CLIENT_ID etc. as environment variables for real login.
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:dummy}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:dummy}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

spring.security.oauth2.client.registration.feide.client-id=${FEIDE_CLIENT_ID:dummy}
spring.security.oauth2.client.registration.feide.client-secret=${FEIDE_CLIENT_SECRET:dummy}
spring.security.oauth2.client.registration.feide.scope=openid,profile,email
spring.security.oauth2.client.registration.feide.client-name=Feide
spring.security.oauth2.client.registration.feide.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.feide.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# issuer-uri is NOT set here: Spring Boot resolves it eagerly at ClientRegistrationRepository
# bean creation (a real network call to the issuer, with no lazy/offline-safe alternative), so
# putting it in profile-independent config would make every run (including CI and running with
# no profile at all) depend on reaching Dataporten at startup. Static dummy endpoints are used
# here instead so Feide's registration is always complete; application-dev.properties overrides
# these with the real issuer-uri (which resolves the real endpoints via discovery).
spring.security.oauth2.client.provider.feide.authorization-uri=https://example.invalid/oauth/authorization
spring.security.oauth2.client.provider.feide.token-uri=https://example.invalid/oauth/token
spring.security.oauth2.client.provider.feide.jwk-set-uri=https://example.invalid/openid/jwks
spring.security.oauth2.client.provider.feide.user-info-uri=https://example.invalid/openid/userinfo
spring.security.oauth2.client.provider.feide.user-name-attribute=sub
