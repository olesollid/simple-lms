spring.test.database.replace=none
spring.datasource.url=jdbc:h2:mem:canvas2-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# This file fully REPLACES src/main/resources/application.properties on the test classpath
# (Spring Boot does not merge same-named files across classpath roots), so the dummy OAuth
# registrations from the main file must be repeated here too, or ClientsConfiguredCondition
# finds no registered clients and the app context fails to start.
spring.security.oauth2.client.registration.github.client-id=dummy
spring.security.oauth2.client.registration.github.client-secret=dummy
spring.security.oauth2.client.registration.github.scope=read:user,user:email

spring.security.oauth2.client.registration.google.client-id=dummy
spring.security.oauth2.client.registration.google.client-secret=dummy
spring.security.oauth2.client.registration.google.scope=openid,email,profile
