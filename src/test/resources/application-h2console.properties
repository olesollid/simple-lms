# Test-only profile: exercises the H2 console (DevelopmentSecurityConfig, gated on
# {"dev", "h2console"}) without activating "dev" itself, since "dev" also registers
# SubmissionGradingListener, which needs a real reachable RabbitMQ broker at startup.
# H2DatabaseTests has nothing to do with quiz grading, so it must not need that broker.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
spring.docker.compose.enabled=false
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
