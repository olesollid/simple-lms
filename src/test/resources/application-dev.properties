# application-dev.properties in src/main/resources sets issuer-uri for the real app; this file
# is on the test classpath at the same relative path, so it fully REPLACES that file's content
# for tests activating the dev profile (e.g. H2DatabaseTests) -- issuer-uri is intentionally
# absent here (static dummy endpoints below instead), since any non-null value, even "", still
# triggers OAuth2ClientPropertiesMapper's eager network call to resolve it at startup. Everything
# else from the main file is repeated here too, since this file replaces, not merges with, it.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
spring.docker.compose.enabled=false
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

spring.security.oauth2.client.registration.feide.client-id=test-feide
spring.security.oauth2.client.registration.feide.client-secret=test-feide-secret
spring.security.oauth2.client.registration.feide.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.feide.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.feide.scope=openid,profile,email
spring.security.oauth2.client.registration.feide.client-name=Feide

spring.security.oauth2.client.provider.feide.authorization-uri=https://example.invalid/oauth/authorization
spring.security.oauth2.client.provider.feide.token-uri=https://example.invalid/oauth/token
spring.security.oauth2.client.provider.feide.jwk-set-uri=https://example.invalid/openid/jwks
spring.security.oauth2.client.provider.feide.user-info-uri=https://example.invalid/openid/userinfo
spring.security.oauth2.client.provider.feide.user-name-attribute=sub
