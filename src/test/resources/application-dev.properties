# application-dev.properties in src/main/resources is for the real app; this file is on the test
# classpath at the same relative path, so it fully REPLACES that file's content for tests
# activating the dev profile (e.g. H2DatabaseTests) -- everything from the main file is repeated
# here too, since this file replaces, not merges with, it.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
spring.docker.compose.enabled=false
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
