image: eclipse-temurin:25-jdk

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .m2/repository/

stages:
  - build
  - test
  - package

build:
  stage: build
  script:
    - ./mvnw compile || mvn compile
  artifacts:
    paths:
      - target/

test:
  stage: test
  script:
    - ./mvnw test || mvn test
  artifacts:
    when: always
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
        - target/failsafe-reports/TEST-*.xml

package:
  stage: package
  script:
    - ./mvnw package -DskipTests || mvn package -DskipTests
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 week
  only:
    - main
    - master