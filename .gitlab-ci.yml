stages:
  - build
  - test
  - package
  - docker-build
  - test-security

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .m2/repository/

# --- Standard Stages ---

build:
  stage: build
  image: eclipse-temurin:25-jdk
  script:
    - ./mvnw compile
  artifacts:
    paths:
      - target/
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH[cite: 10]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"[cite: 10]

test:
  stage: test
  image: eclipse-temurin:25-jdk
  script:
    - ./mvnw test
  artifacts:
    when: always[cite: 10]
    paths:
      - target/surefire-reports/
      - target/failsafe-reports/
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml[cite: 10]
        - target/failsafe-reports/TEST-*.xml[cite: 10]
    expire_in: 1 week[cite: 10]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH[cite: 10]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"[cite: 10]

package:
  stage: package
  image: eclipse-temurin:25-jdk
  script:
    - ./mvnw package -DskipTests
  artifacts:
    paths:
      - target/*.jar[cite: 10, 13]
    expire_in: 1 day[cite: 10]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH[cite: 10]

# --- Buildkit Docker Build Stage (Section 5.3) ---

.buildkit:
  image:
    name: moby/buildkit:latest[cite: 11, 12]
    entrypoint: [""][cite: 11, 12]
  tags:
    - buildkit[cite: 11, 12]
  before_script:
    - mkdir -p ~/.docker[cite: 11, 12]
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > ~/.docker/config.json[cite: 11, 12]

docker-build:
  extends: .buildkit[cite: 12]
  stage: docker-build
  script:
    - buildctl build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --output type=image,"name=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA,$CI_REGISTRY_IMAGE:latest",push=true[cite: 12]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH[cite: 10]

# --- Security Scanning ---

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

sast:
  stage: test-security
secret_detection:
  stage: test-security