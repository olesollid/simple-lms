stages:
  - build
  - test
  - package
  - docker-build
  - test-security

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  # CI_REGISTRY_IMAGE still resolves to an old project path because the container
  # registry namespace didn't follow a prior project rename. Pin the image path
  # explicitly to the current project (canvas-v2) until that's cleaned up on GitLab's side.
  DOCKER_IMAGE_NAME: "$CI_REGISTRY/hvl-dat-250/26h/semester-project/group-9/canvas-v2"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .m2/repository/

# --- Standard Stages ---

build:
  stage: build
  image: eclipse-temurin:25-jdk
  script:
    - ./mvnw compile
  artifacts:
    paths:
      - target/
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

test:
  stage: test
  image: eclipse-temurin:25-jdk
  script:
    - ./mvnw test
  artifacts:
    when: always
    paths:
      - target/surefire-reports/
      - target/failsafe-reports/
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
        - target/failsafe-reports/TEST-*.xml
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

package:
  stage: package
  image: eclipse-temurin:25-jdk
  script:
    - ./mvnw package -DskipTests
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# --- Buildkit Docker Build Stage (Section 5.3) ---

.buildkit:
  image:
    name: moby/buildkit:latest
    entrypoint: [""]
  tags:
    - buildkit
  before_script:
    - mkdir -p ~/.docker
    - 'echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > ~/.docker/config.json'

docker-build:
  extends: .buildkit
  stage: docker-build
  script:
    - |
      buildctl build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --output type=image,\"name=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA,$CI_REGISTRY_IMAGE:latest\",push=true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# --- Security Scanning ---

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

sast:
  stage: test-security
secret_detection:
  stage: test-security