stages:
  - build
  - test
  - package
  - docker-build
  - test-security

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .m2/repository/

# --- Standard Stages ---

# Shared setup for the frontend jobs: Node image, lockfile-keyed npm cache,
# reproducible install with `npm ci`, and the same trigger rules as the backend.
.frontend:
  image: node:22.22.2-bookworm-slim
  cache:
    key:
      prefix: frontend-npm
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/
  before_script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

frontend-lint:
  extends: .frontend
  stage: test
  script:
    - npm run lint

frontend-test:
  extends: .frontend
  stage: test
  script:
    - npm test -- --reporter=default --reporter=junit --outputFile.junit=junit.xml
  artifacts:
    when: always
    paths:
      - frontend/junit.xml
    reports:
      junit: frontend/junit.xml
    expire_in: 1 week

frontend-build:
  extends: .frontend
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 week

build:
  stage: build
  image: eclipse-temurin:25-jdk
  script:
    - ./mvnw compile
  artifacts:
    paths:
      - target/
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

test:
  stage: test
  image: eclipse-temurin:25-jdk
  # QuizGradingPipelineIntegrationTests needs a real Docker daemon (via Testcontainers) to spin
  # up disposable RabbitMQ and Redis containers. This runner's docker:dind service doesn't
  # expose a reachable daemon (no privileged mode), so the test is excluded here and must be run
  # locally with Docker available, e.g. `./mvnw test -Dtest=QuizGradingPipelineIntegrationTests`.
  script:
    - ./mvnw test -Dsurefire.excludesFile=ci-excluded-tests.txt
  artifacts:
    when: always
    paths:
      - target/surefire-reports/
      - target/failsafe-reports/
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
        - target/failsafe-reports/TEST-*.xml
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

package:
  stage: package
  image: eclipse-temurin:25-jdk
  script:
    - ./mvnw package -DskipTests
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# --- Buildkit Docker Build Stage (Section 5.3) ---

.buildkit:
  image:
    name: moby/buildkit:latest
    entrypoint: [""]
  tags:
    - buildkit
  before_script:
    - mkdir -p ~/.docker
    - 'echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > ~/.docker/config.json'

# Pushes the app image as $CI_REGISTRY_IMAGE/app, tagged with the commit and "latest".
# compose.yaml runs "${D250_REG}/app:latest", so a host deploys this image with
# D250_REG set to $CI_REGISTRY_IMAGE (see "Deploy to a host" in the README).
docker-build:
  extends: .buildkit
  stage: docker-build
  script:
    - |
      buildctl build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --output type=image,\"name=$CI_REGISTRY_IMAGE/app:$CI_COMMIT_SHA,$CI_REGISTRY_IMAGE/app:latest\",push=true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# --- Security Scanning ---

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

sast:
  stage: test-security
secret_detection:
  stage: test-security
